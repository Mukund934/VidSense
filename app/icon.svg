<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    A moment, located.

    The product's whole claim is that a quote has a place on a timeline and that
    we know how precisely. So: the line is the video, the mark is the moment, and
    the bracket around it is the tolerance — which is the honest version of a
    pin. Not a play button; everyone has one of those, and we never play anything.
  -->
  <rect width="32" height="32" rx="7" fill="#2f5fd0"/>
  <path d="M7 16h18" stroke="#fff" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>
  <path d="M13 11v10M19 11v10" stroke="#fff" stroke-opacity=".55" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="3.25" fill="#fff"/>
</svg>
